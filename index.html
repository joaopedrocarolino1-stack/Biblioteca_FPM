else if(page=='livros')h=`<h2>Livros</h2><button class="btn" onclick="newBook()">+ Novo Livro</button> <button class="btn o" onclick="B.forEach(b=>{if(!b.img)b.tried=false});toast('Buscando capas na internet...');coverAll()">Buscar capas</button><div class="card tw" style="margin-top:12px"><table><tr><th>Capa</th><th>Título</th><th>Autor</th><th>Código</th><th>Editora</th><th>ISBN</th><th>Categoria</th><th>Status</th><th>Qtd</th></tr>${B.map(b=>`<tr><td><div class="cov mini" style="background:${b.c}">${art(b)}${imgTag(b)}</div></td><td>${b.t}</td><td>${b.a}</td><td>LIV-${String(b.id).padStart(4,'0')}</td><td>${b.p||'—'}</td><td>${b.i||'—'}</td><td>${b.g}</td><td><span class="tag ${b.q?'t-ok':'t-bad'}">${b.q?'Disponível':'Emprestado'}</span></td><td>${b.q}</td></tr>`).join('')}</table></div>`;
else if(page=='empa')h=`<h2>Empréstimos</h2><button class="btn" onclick="newLoan()">+ Registrar Empréstimo</button><div class="card tw" style="margin-top:12px"><table><tr><th>Livro</th><th>Aluno</th><th>Retirada</th><th>Devolução</th><th>Status</th></tr>${L.map(l=>{const s=st(l.left);return `<tr><td>${bk(l.b).t}</td><td>${l.s}</td><td>${l.d}</td><td>${l.due}</td><td><span class="tag ${s[0]}">${s[1]}</span></td></tr>`}).join('')}</table></div>`;
else if(page=='dev')h=`<h2>Devoluções</h2><div class="grid">${L.map((l,i)=>`<div class="card"><b>${bk(l.b).t}</b><p class="mut">${l.s} · prevista ${l.due}</p>${l.left<0?'<span class="tag t-bad">Atrasado</span>':''}<div class="row"><button class="btn g" onclick="ret(${i})">Registrar devolução</button></div></div>`).join('')||'<p class="mut">Nenhum empréstimo pendente.</p>'}</div>`;
else if(page=='atr')h=`<h2>Livros Atrasados</h2><div class="card tw"><table><tr><th>Aluno</th><th>Livro</th><th>Devolução</th><th>Atraso</th><th></th></tr>${L.filter(l=>l.left<0).map(l=>`<tr><td>${l.s}</td><td>${bk(l.b).t}</td><td>${l.due}</td><td style="color:var(--bad)">${-l.left} dias</td><td><button class="btn r" onclick="toast('Lembrete enviado para ${l.s}')">Enviar lembrete</button></td></tr>`).join('')||'<tr><td>Sem atrasos </td></tr>'}</table></div>`;
else if(page=='atend'){const x=S.find(y=>y.id==at);h=`<h2>Atendimento por QR Code</h2><p class="mut">Leia o QR Code do aluno para abrir os dados e registrar o empréstimo rapidamente.</p><div class="card"><div class="bar"><input id="ac" placeholder="Código lido do QR (ex.: ALU-0001)"><button class="btn" onclick="attend()">Abrir aluno</button><button class="btn o" onclick="simScan()">Simular leitura</button><button class="btn o" onclick="camOn()">Ler com a câmera</button></div><video id="vid" playsinline muted style="display:none;width:100%;max-width:420px;border-radius:10px;background:#000;margin-top:10px"></video></div>${x?stuCard(x):''}`}
else if(page=='alunos')h=`<h2>Alunos</h2><p class="mut">Dados fictícios de exemplo. Clique em Editar, altere os campos e confirme em Salvar alterações.</p><div class="bar"><input placeholder="Buscar por nome, CPF ou e-mail" value="${sq}" oninput="sq=this.value;$('sb').innerHTML=stuRows()"><button class="btn" onclick="editStu(0)">+ Novo Aluno</button></div><div class="card tw" style="margin-top:12px"><table><tr><th>Nome</th><th>CPF</th><th>Idade</th><th>Turma</th><th>Telefone</th><th>E-mail</th><th></th></tr><tbody id="sb">${stuRows()}</tbody></table></div>`;
else if(page=='aud')h=`<h2>Auditoria do Sistema</h2><div class="card tw"><table><tr><th>Data</th><th>Hora</th><th>Usuário</th><th>Ação</th><th>Descrição</th></tr>${log.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
m.innerHTML=h;save()}
function newBook(){openM(`<h3>Novo Livro</h3><input id="nt" placeholder="Título"><input id="na" placeholder="Autor"><input id="np" placeholder="Editora"><input id="ni" placeholder="ISBN"><input id="nq" type="number" placeholder="Quantidade" value="1"><button class="btn" onclick="addBook()">Salvar</button>`)}
function addBook(){const t=$('nt').value||'Sem título';B.push({id:Math.max(...B.map(x=>x.id))+1,t,a:$('na').value||'—',g:'Geral',y:null,p:$('np').value,i:$('ni').value,q:+$('nq').value||1,c:'#1f4e79'});log.unshift(['07/10/2026','—','Administrador','Cadastro de livro',t]);closeM();toast('Livro cadastrado: LIV-'+String(B[B.length-1].id).padStart(4,'0'));render();coverAll()}
function newLoan(){openM(`<h3>Registrar Empréstimo</h3><select id="lb">${B.filter(b=>b.q).map(b=>`<option value="${b.id}">${b.t}</option>`).join('')}</select><select id="ls"><option>João Silva</option><option>Maria Souza</option><option>Ana Lima</option></select><button class="btn" onclick="addLoan()">Registrar</button>`)}
function addLoan(){const b=bk($('lb').value);b.q--;L.push({b:b.id,s:$('ls').value,d:'07/10',due:'21/10',left:14});log.unshift(['07/10/2026','—','Bibliotecário','Registro de empréstimo',b.t]);closeM();toast('Empréstimo registrado');render()}
function ret(i){const l=L.splice(i,1)[0];bk(l.b).q++;log.unshift(['07/10/2026','—','Bibliotecário','Devolução',bk(l.b).t]);toast('Devolução registrada');render()}
S.forEach(x=>{if(!x.e)x.e=x.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ /g,'.')+'@aluno.fpm.edu.br'});
try{const d=JSON.parse(localStorage.getItem('fpm_db')||'null');if(d){S=d.S;L=d.L;log=d.log;favs=new Set(d.f);d.B.forEach(x=>{const b=B.find(y=>y.id==x.id);if(b){b.q=x.q;if(x.img)b.img=x.img;if(x.tried)b.tried=true}else B.push(x)})}}catch(e){}
S.forEach(x=>{if(x.f===undefined&&x.id<=6)x.f='(11) 90000-'+String(x.id).padStart(4,'0')});
tab('aluno');
coverAll();
</script></body></html>
