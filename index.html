  if(t&&okQR(t)){attend(t);return}qs(t?'QR lido, mas não é de um aluno da biblioteca.':'Não encontrei um QR Code nessa foto. Tente de novo, mais de perto e com boa luz.')}
 catch(e){qs('Não foi possível abrir a foto.')}}
/* ===== Livros: editar e excluir ===== */
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function newBook(){openM(`<h3>Novo Livro</h3><input id="nt" placeholder="Título"><input id="na" placeholder="Autor"><input id="np" placeholder="Editora"><input id="ni" placeholder="ISBN"><input id="ng" placeholder="Gênero (ex.: Romance)"><input id="ny" type="number" placeholder="Ano de publicação original"><input id="nq" type="number" min="1" placeholder="Quantidade" value="1"><button class="btn" onclick="addBook()">Salvar</button><button class="btn o" onclick="closeM()">Cancelar</button>`)}
async function addBook(){const t=$('nt').value.trim();if(!t){toast('Informe o título');return}
 const {data,error}=await sb.from('livros').insert({titulo:t,autor:$('na').value.trim()||'—',editora:$('np').value.trim()||null,isbn:$('ni').value.trim()||null,genero:$('ng').value.trim()||'Geral',ano:+$('ny').value||null,quantidade:+$('nq').value||1}).select();
 if(error){toast(dbErr(error));return}if(!data||data.length!=1){toast('O livro não foi gravado no banco (sem permissão).');return}
 closeM();if(!await loadAll())return;toast('Livro cadastrado');render();coverAll()}
function editBook(id){const b=bk(id);openM(`<h3>Editar livro</h3><label class="mut">Título</label><input id="et" value="${esc(b.t)}"><label class="mut">Autor</label><input id="ea" value="${esc(b.a)}"><label class="mut">Editora</label><input id="ep" value="${esc(b.p)}"><label class="mut">ISBN</label><input id="ei" value="${esc(b.i)}"><label class="mut">Gênero</label><input id="eg" value="${esc(b.g)}"><label class="mut">Ano de publicação original</label><input id="ey" type="number" value="${esc(b.o)}"><label class="mut">Quantidade total de exemplares</label><input id="eq" type="number" min="0" value="${b.qt==null?b.q:b.qt}"><div id="ee" style="color:var(--bad);font-size:13px"></div><button class="btn" onclick="saveBook(${id})">Salvar alterações</button><button class="btn o" onclick="closeM()">Cancelar</button>`)}
async function saveBook(id){const b=bk(id),t=$('et').value.trim(),a=$('ea').value.trim()||'—',p=$('ep').value.trim()||null,i=$('ei').value.trim()||null,g=$('eg').value.trim()||'Geral',y=+$('ey').value||null,q=+$('eq').value,emp=(b.qt==null?0:b.qt-b.q),fail=x=>{$('ee').textContent=x};
 if(!t)return fail('Informe o título.');if(!(q>=0)||!Number.isInteger(q))return fail('Quantidade inválida.');if(q<emp)return fail('Há '+emp+' exemplar(es) emprestado(s). A quantidade não pode ser menor que isso.');
 const mudou=t!=b.t||a!=b.a||(i||'')!=(b.i||''),pl={titulo:t,autor:a,editora:p,isbn:i,genero:g,ano:y,quantidade:q};if(mudou)pl.capa_url=null;
 const {data,error}=await sb.from('livros').update(pl).eq('id',id).select();if(error)return fail(dbErr(error));if(!data||data.length!=1)return fail('Nada foi alterado no banco (sem permissão ou livro inexistente).');
 if(mudou){delete b.img;b.tried=false}
 if(!await loadAll())return fail('Salvo, mas a lista não pôde ser atualizada: '+lastErr);closeM();toast('Livro atualizado');render();if(mudou)coverAll()}
function askDelBook(id){const b=bk(id),emp=(b.qt==null?0:b.qt-b.q);
 if(emp>0){openM(`<h3>Não é possível excluir</h3><p><b>${b.t}</b> tem ${emp} exemplar(es) emprestado(s). Registre a devolução antes de excluir.</p><button class="btn o" onclick="closeM()">Entendi</button>`);return}
 openM(`<h3>Excluir livro</h3><p>Excluir <b>${b.t}</b> (LIV-${String(b.id).padStart(4,'0')}) do catálogo? Os favoritos e solicitações desse livro também serão removidos. Esta ação não pode ser desfeita.</p><button class="btn r" onclick="delBook(${id})">Sim, excluir</button><button class="btn o" onclick="closeM()">Cancelar</button>`)}
async function delBook(id){const {data,error}=await sb.from('livros').delete().eq('id',id).select();
 if(error){closeM();toast(error.code=='23503'||/foreign key/i.test(error.message||'')?'Este livro tem histórico de empréstimos e não pode ser excluído. Edite-o e zere a quantidade para tirá-lo de circulação.':dbErr(error));return}
 if(!data||data.length!=1){closeM();toast('O livro não foi excluído (sem permissão ou já removido).');return}
 if(!await loadAll())return;closeM();toast('Livro excluído');render()}
boot();
</script></body></html>
